services:
  app:
    image: node:18-alpine
    container_name: wanwangee-app
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm start"
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - NODE_ENV=production
      - DATABASE_URL=postgresql://root:123@db:5432/wanwangee
    restart: always

networks:
  default:
    name: shared-network
    external: true
