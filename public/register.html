<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOYHEART - 會員資料註冊與綁定</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FFD637',
                        brandBlack: '#000000',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brandBlack text-white min-h-screen flex flex-col justify-between font-sans relative">

    <!-- 未加入會員彈跳視窗 (Modal) -->
    <div id="registerModal" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <div class="w-12 h-12 bg-brandYellow/10 text-brandYellow rounded-full flex items-center justify-center mx-auto text-xl font-black">
                ⚠
            </div>
            <h3 class="text-lg font-black text-white">尚未加入 TOYHEART 會員</h3>
            <p class="text-xs text-zinc-400">檢測到您的 LINE 帳號尚未完成實名與收件資料綁定，請點擊下方按鈕進行註冊以解鎖預購資格。</p>
            <button onclick="closeModal()" class="w-full bg-brandYellow hover:bg-yellow-400 text-brandBlack font-black py-3 rounded-xl transition text-sm shadow-lg">
                立即填寫註冊資料
            </button>
        </div>
    </div>

    <!-- 頂部導覽列 -->
    <header class="bg-brandYellow text-brandBlack sticky top-0 z-40 p-4 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
            <div>
                <span class="text-[10px] font-bold tracking-widest block opacity-75 leading-none">TOYHEART MEMBER</span>
                <h1 class="text-base font-black tracking-wider">會員專屬資料綁定</h1>
            </div>
        </div>
        <div id="memberBadge" class="text-xs bg-brandBlack text-brandYellow px-3 py-1 rounded-full font-bold shadow-inner">
            👑 綁定中心
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="p-4 sm:p-6 max-w-lg mx-auto w-full flex-grow space-y-6">
        
        <!-- LINE 個人名片小卡 -->
        <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-3xl shadow-xl flex items-center space-x-4">
            <div class="relative flex-shrink-0">
                <img id="lineAvatar" src="https://via.placeholder.com/150" alt="LINE 頭像" class="w-16 h-16 rounded-full object-cover border-2 border-brandYellow">
                <span class="absolute -bottom-1 -right-1 bg-green-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full shadow border border-brandBlack">
                    LINE
                </span>
            </div>
            <div class="flex-grow">
                <div class="flex items-center space-x-2">
                    <h2 id="lineNickname" class="text-base font-black text-white tracking-wide">載入中...</h2>
                    <span id="memberLevelTag" class="bg-blue-500/20 text-blue-400 border border-blue-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full">
                        一般會員
                    </span>
                </div>
                <p id="lineUidDisplay" class="text-[11px] text-zinc-500 font-mono mt-0.5 truncate max-w-[200px]">UID: 讀取中...</p>
            </div>
        </div>

        <!-- 填寫真實姓名與收件資料表單 -->
        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl shadow-xl space-y-4">
            <div class="border-b border-zinc-800 pb-3">
                <h3 class="text-sm font-bold text-brandYellow">📝 填寫收件與真實身分資料</h3>
                <p class="text-xs text-zinc-400 mt-1">為了確保商品寄送與預購對帳無誤，請填寫您的真實姓名與常用資料。</p>
            </div>

            <form id="registerForm" onsubmit="submitMemberData(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-zinc-400 mb-1">真實姓名 <span class="text-red-400">*</span></label>
                    <input type="text" id="realName" required placeholder="例如：陳大文 (請與收件人相符)" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-brandYellow">
                </div>

                <div>
                    <label class="block text-zinc-400 mb-1">手機號碼 <span class="text-red-400">*</span></label>
                    <input type="tel" id="phone" required placeholder="例如：0912345678" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-brandYellow">
                </div>

                <div>
                    <label class="block text-zinc-400 mb-1">電子信箱 (Email) <span class="text-red-400">*</span></label>
                    <input type="email" id="email" required placeholder="例如：example@gmail.com" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-brandYellow">
                </div>

                <div>
                    <label class="block text-zinc-400 mb-1">常用郵寄地址 <span class="text-red-400">*</span></label>
                    <textarea id="address" required rows="2" placeholder="例如：台北市信義區信義路五段7號..." class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-brandYellow"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-zinc-400 mb-1">生日日期</label>
                        <input type="text" id="birthday" placeholder="例如：10-15" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-brandYellow">
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-1">性別</label>
                        <select id="gender" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-brandYellow">
                            <option value="不透露">不透露</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                </div>

                <input type="hidden" id="lineUid">
                <input type="hidden" id="lineNicknameHidden">

                <button type="submit" class="w-full bg-brandYellow hover:bg-yellow-400 text-brandBlack font-black py-3 rounded-xl transition text-sm shadow-lg mt-4">
                    確認送出並更新綁定資料
                </button>
            </form>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-zinc-600 border-t border-zinc-900">
        &copy; 2026 TOYHEART Member System. All Rights Reserved.
    </footer>

    <!-- 邏輯與 API 互動 -->
    <script>
        const API_BASE_URL = "https://wanwangee.zeabur.app";
        const MY_LIFF_ID = "2011841001-7yVwI75U"; 

        document.addEventListener("DOMContentLoaded", function () {
            liff.init({ liffId: MY_LIFF_ID })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        liff.getProfile().then(profile => {
                            setupUserData(profile.userId, profile.displayName, profile.pictureUrl);
                        }).catch(err => {
                            console.error('取得 LINE Profile 失敗', err);
                        });
                    }
                })
                .catch((err) => {
                    console.log('LIFF 初始化失敗（外部瀏覽器測試中）', err);
                    // 測試用模擬 UID (您可以切換不同的 UID 測試已綁定或未綁定)
                    setupUserData("U_test_new_user_999", "測試新玩家", null);
                });
        });

        async function setupUserData(uid, displayName, pictureUrl) {
            document.getElementById('lineNickname').innerText = displayName;
            document.getElementById('lineNicknameHidden').value = displayName;
            document.getElementById('lineUid').value = uid;
            document.getElementById('lineUidDisplay').innerText = `UID: ${uid}`;
            if (pictureUrl) {
                document.getElementById('lineAvatar').src = pictureUrl;
            }

            // 向後端檢查是否已綁定過
            try {
                const res = await fetch(`${API_BASE_URL}/api/users/check/${uid}`);
                const result = await res.json();

                if (result.success && result.bound) {
                    // 已綁定：自動帶入會員資料到畫面
                    const user = result.data;
                    document.getElementById('realName').value = user.real_name || '';
                    document.getElementById('phone').value = user.phone || '';
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('address').value = user.address || '';
                    document.getElementById('birthday').value = user.birthday || '';
                    document.getElementById('gender').value = user.gender || '不透露';
                    if (user.member_level) {
                        document.getElementById('memberLevelTag').innerText = user.member_level;
                    }
                } else {
                    // 未綁定：強制顯示彈跳視窗
                    document.getElementById('registerModal').classList.remove('hidden');
                }
            } catch (error) {
                console.error('檢查綁定狀態失敗:', error);
                document.getElementById('registerModal').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        async function submitMemberData(event) {
            event.preventDefault();

            const memberData = {
                uid: document.getElementById('lineUid').value,
                line_nickname: document.getElementById('lineNicknameHidden').value,
                real_name: document.getElementById('realName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                birthday: document.getElementById('birthday').value,
                gender: document.getElementById('gender').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/users/bind`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(memberData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('🎉 會員資料與真實姓名綁定成功！');
                    if (liff.isInClient()) {
                        liff.closeWindow();
                    }
                } else {
                    alert('綁定失敗：' + (result.message || '未知錯誤'));
                }
            } catch (error) {
                console.error('API 請求錯誤:', error);
                alert('連線伺服器失敗，請稍後再試。');
            }
        }
    </script>
</body>
</html>
